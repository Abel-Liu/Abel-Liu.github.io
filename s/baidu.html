<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf8" />
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no" />
    <title>批量地址查询</title>
    <style type="text/css">
        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            font-family: "微软雅黑";
        }

        #l-map {
            height: calc(100vh - 140px);
            width: 100%;
        }

        #r-result {
            width: 100%;
            font-size: 14px;
            line-height: 20px;
            padding: 5px;
        }
        .BMapLabel{
            opacity:.7;
        }
    </style>
    <script type="text/javascript" src="https://code.jquery.com/jquery-3.2.0.min.js"></script>
    <script type="text/javascript" src="http://api.map.baidu.com/api?v=2.0&ak=qzympt9BFcyNgVygpCxORpsO8GlnXGfE"></script>
</head>
<body>
    <div id="l-map"></div>
    <div id="r-result">
        <input id="txtCity" type="text" value="北京市" />
        <input type="button" value="批量地址解析" onclick="go()" /><br/>
        <textarea id="txtAddr" rows="5" style="width:90%;margin-top: 10px;">
首都医科大学附属复兴医院    北京市西城区复兴门外大街甲20号
首都医科大学宣武医院  北京市西城区长椿街45号
应急管理部应急总医院  北京市朝阳区西坝河南里29号
战略支援部队特色医学中心    北京市朝阳区安翔北路9号
中国航天科工集团七三一医院   北京市丰台区云岗镇镇岗南里3号院
中国人民解放军空军特色医学中心 北京市海淀区阜成路30号
中国人民解放军总医院第八医学中心    北京市海淀区黑山扈路甲17号
中国人民解放军总医院第三医学中心    北京市海淀区永定路69号
中国人民解放军总医院第四医学中心    北京市海淀区阜城路51号
中国人民解放军总医院第五医学中心（南院区）（原307医院）   北京市丰台区东大街8号
中国人民解放军总医院第五医学中心（原302医院）    北京市丰台区西四环中路100号
中国人民解放军总医院第一医学中心    北京市海淀区复兴路28号
中国医科大学航空总医院 北京市朝阳区安外北苑三号院
中国医学科学院北京协和医院   北京市东城区东单帅府园1号
中国医学科学院阜外医院 北京市西城区北礼士路167号
中国医学科学院肿瘤医院 北京市朝阳区潘家园南里17号
中国中医科学院广安门医院    北京市西城区北线阁5号院
中国中医科学院广安门医院（南区）    北京市大兴区清源街道兴丰大街二段138号
中国中医科学院望京医院 北京市朝阳区望京中环南路6号
中国中医科学院西苑医院 北京市海淀区西苑操场1号

</textarea>
    </div>
</body>
</html>
<script type="text/javascript">
    var map = new BMap.Map("l-map");
    map.centerAndZoom(new BMap.Point(116.395645, 39.928216), 12);
    map.enableScrollWheelZoom(true);
    var index = 0;
    var myGeo = new BMap.Geocoder();
    var adds = [];

    function go() {
        adds = $('#txtAddr').val().split('\n');
        map.clearOverlays();
        index = 0;
        next();
    }

    function next() {
        var add = adds[index];
        geocodeSearch(add, index);
        index++;
    }

    function geocodeSearch(add, idx) {
        if (index < adds.length) {
            setTimeout(window.next, 300);
        }
        if (!add)
            return;
        myGeo.getPoint(add, function (point) {
            if (point) {
                var address = new BMap.Point(point.lng, point.lat);
                addMarker(address, new BMap.Label((idx+1) + ":" + add, { offset: new BMap.Size(20, -10) }));
            }
        }, $("#txtCity").val());
    }

    function addMarker(point, label) {
        var marker = new BMap.Marker(point);
        map.addOverlay(marker);
        marker.setLabel(label);
    }
</script>
